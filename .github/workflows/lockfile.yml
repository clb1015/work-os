name: Generate package lock

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --package-lock-only
      - run: |
          if [ -z "$(git status --porcelain package-lock.json)" ]; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "Work OS CI"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Add package lockfile"
          git push
