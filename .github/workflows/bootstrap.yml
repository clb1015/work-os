name: Bootstrap Work OS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore canonical Phase 1 source
        shell: bash
        run: |
          if [ -f package.json ] && grep -q '"next": "16.3.8"' package.json; then
            echo "Canonical source already restored"
            exit 0
          fi
          rm -rf src bunfig.toml components.json vite.config.ts vitest.config.ts .prettierignore .prettierrc
          cat .bootstrap/chunk-*.txt > /tmp/work-os.tar.gz.b64
          base64 -d /tmp/work-os.tar.gz.b64 > /tmp/work-os.tar.gz
          tar -xzf /tmp/work-os.tar.gz -C .
          rm -rf .bootstrap /tmp/work-os.tar.gz /tmp/work-os.tar.gz.b64
          git config user.name "Work OS Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Bootstrap canonical Work OS Phase 1"
          git push
