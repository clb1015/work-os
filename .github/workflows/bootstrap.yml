name: Bootstrap Work OS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Phase 1 source
        shell: bash
        run: |
          if [ -f package.json ]; then echo "Source already restored"; exit 0; fi
          cat > /tmp/work-os.tar.gz.b64 <<'ARCHIVE'

ARCHIVE
          base64 -d /tmp/work-os.tar.gz.b64 > /tmp/work-os.tar.gz
          tar -xzf /tmp/work-os.tar.gz -C .
          rm -f /tmp/work-os.tar.gz /tmp/work-os.tar.gz.b64
          git config user.name "Work OS Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -m "Bootstrap Work OS Phase 1"
          git push
